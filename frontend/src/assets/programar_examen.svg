<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="calShadow" x="12" y="18" width="104" height="98" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <linearGradient id="calHeader" x1="20" y1="22" x2="108" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="calBody" x1="20" y1="46" x2="108" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="clockGrad" x1="72" y1="72" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Calendar Base -->
  <g filter="url(#calShadow)">
    <!-- Main Board -->
    <rect x="20" y="24" width="88" height="80" rx="16" fill="url(#calBody)" />
    <!-- Header -->
    <path d="M20 40C20 31.1634 27.1634 24 36 24H92C100.837 24 108 31.1634 108 40V46H20V40Z" fill="url(#calHeader)" />
    
    <!-- Rings / Pins -->
    <rect x="36" y="16" width="6" height="14" rx="3" fill="#94A3B8" />
    <rect x="86" y="16" width="6" height="14" rx="3" fill="#94A3B8" />
    <circle cx="39" cy="18" r="2" fill="#E2E8F0" />
    <circle cx="89" cy="18" r="2" fill="#E2E8F0" />

    <!-- Calendar Grid Rows -->
    <rect x="32" y="56" width="12" height="10" rx="3" fill="#E2E8F0" />
    <rect x="50" y="56" width="12" height="10" rx="3" fill="#E2E8F0" />
    <rect x="68" y="56" width="12" height="10" rx="3" fill="#CBD5E1" />
    <rect x="32" y="72" width="12" height="10" rx="3" fill="#CBD5E1" />
    <rect x="50" y="72" width="12" height="10" rx="3" fill="#FDA4AF" />

    <!-- Floating Exam Clock Badge -->
    <g>
      <circle cx="86" cy="84" r="18" fill="url(#clockGrad)" stroke="#FFFFFF" stroke-width="3" />
      <!-- Clock Hands -->
      <path d="M86 74V84L93 88" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
