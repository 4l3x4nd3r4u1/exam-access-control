<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="eligShadow" x="16" y="16" width="96" height="102" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#000000" flood-opacity="0.16" />
    </filter>
    <linearGradient id="boardGrad" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="clipGrad" x1="48" y1="14" x2="80" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="checkBadgeGrad" x1="72" y1="72" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="30" y1="36" x2="70" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <g filter="url(#eligShadow)">
    <!-- Clipboard Board -->
    <rect x="26" y="22" width="76" height="88" rx="14" fill="url(#boardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Top Clip -->
    <rect x="46" y="15" width="36" height="14" rx="4" fill="url(#clipGrad)" />
    <circle cx="64" cy="20" r="3" fill="#F8FAFC" />

    <!-- Card Header / Student bar -->
    <rect x="36" y="36" width="36" height="6" rx="3" fill="url(#headerGrad)" />

    <!-- List Items with Checks -->
    <!-- Row 1 -->
    <circle cx="42" cy="54" r="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
    <path d="M40 54L41.5 55.5L44.5 52.5" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="52" y="52" width="38" height="4" rx="2" fill="#64748B" />

    <!-- Row 2 -->
    <circle cx="42" cy="68" r="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
    <path d="M40 68L41.5 69.5L44.5 66.5" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="52" y="66" width="30" height="4" rx="2" fill="#64748B" />

    <!-- Row 3 -->
    <circle cx="42" cy="82" r="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="1.5" />
    <path d="M40 82L41.5 83.5L44.5 80.5" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="52" y="80" width="22" height="4" rx="2" fill="#94A3B8" />

    <!-- Floating Big Verification Seal -->
    <g>
      <circle cx="86" cy="84" r="18" fill="url(#checkBadgeGrad)" stroke="#FFFFFF" stroke-width="3" />
      <path d="M78 84L83.5 89.5L94 79" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
